instructions:
  - name: General Engineering Review
    fileFilters:
      - "**/*"
      - "!**/*.lock"
      - "!**/dist/**"
      - "!**/build/**"
    instructions: |
      1. Prioritize actionable correctness defects, regressions, data integrity, authorization, security, and performance issues.
      2. Report a finding only when the changed code and available context support a concrete failure mode.
      3. Include the affected behavior and practical impact. Avoid speculative comments and style-only suggestions.
      4. Check whether errors are handled at the correct layer and whether duplicate logging or swallowed exceptions hide failures.
      5. Check whether tests cover important success, failure, and boundary cases. Do not assume a test was run unless pipeline evidence shows it.
      6. Do not expose secrets, access tokens, personal data, or confidential payloads in review comments.

  - name: Java and Spring
    fileFilters:
      - "**/*.java"
    instructions: |
      1. Check null handling, exception propagation, transaction boundaries, resource cleanup, and thread safety where relevant.
      2. Check authorization at service and API boundaries, not only whether a UI hides an action.
      3. Check database access for N+1 queries, unbounded result sets, missing pagination, and expensive operations.
      4. Check external calls for timeouts, retry safety, and error handling.
      5. Consider compatibility with the project's configured Java version; do not suggest unsupported language features.

  - name: SAP Commerce OCC
    fileFilters:
      - "**/*Controller.java"
      - "**/*WsDTO.java"
      - "**/*Data.java"
    instructions: |
      1. Check class-level and method-level request mappings together when determining the final endpoint path.
      2. Check DTO validation, required fields, conversion logic, and response status handling.
      3. Check authorization and data access boundaries for customer/store context.
      4. Check pagination, query cost, and accidental exposure of internal model fields.
      5. Consider backward compatibility of public OCC contracts.

  - name: SAP CAP and CDS
    fileFilters:
      - "**/*.cds"
      - "**/*.ts"
      - "**/*.js"
    instructions: |
      1. Check CDS authorization annotations such as @requires and @restrict and whether custom handlers enforce equivalent checks where needed.
      2. Check transactional behavior, query efficiency, and safe handling of user-controlled filters and parameters.
      3. For events, check payload compatibility, required business attributes, stable identifiers, state/version semantics, and idempotency.
      4. Check that asynchronous handlers handle failures and retries without creating duplicate side effects.
      5. Avoid assuming a CAP annotation is enforced by custom code unless the runtime behavior and service path support that conclusion.

  - name: Database and SQL
    fileFilters:
      - "**/*.sql"
    instructions: |
      1. Check query predicates, joins, aggregation, indexes, and expected row counts for performance risks.
      2. Check data migrations for rollback/forward compatibility and safe handling of existing data.
      3. Check transaction scope, locking, and referential integrity.
      4. Avoid proposing an index without explaining the query pattern and likely trade-offs.
